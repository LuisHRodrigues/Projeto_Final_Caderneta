# Ambiente local que espelha a produção: MySQL 8.4 -> migracao (tarefa única, Flyway) -> backend -> frontend.
# Senhas: obrigatórias no arquivo .env (ignorado pelo git). Não há senha padrão. Ver .env.example.
services:
  # 1. MySQL 8.4 LTS. Volume NOVO (mysql84_data): o volume antigo "mysql_data" (MySQL 8.0) fica intocado,
  #    pois abrir um diretório 8.0 com o 8.4 converte os dados sem volta.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: api_caderneta_database
      # Lidas pelo script de inicialização que cria os usuários separados (só em volume novo).
      CADERNETA_DB_PASSWORD: ${CADERNETA_DB_PASSWORD:?defina CADERNETA_DB_PASSWORD no .env}
      CADERNETA_MIGRATION_PASSWORD: ${CADERNETA_MIGRATION_PASSWORD:?defina CADERNETA_MIGRATION_PASSWORD no .env}
    ports:
      - "127.0.0.1:3307:3306" # só a própria máquina acessa o banco
    networks:
      - minha-rede
    volumes:
      - mysql84_data:/var/lib/mysql
      - ./backend-repo/scripts/criar-usuarios-mysql.sh:/docker-entrypoint-initdb.d/01-usuarios-caderneta.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Migrations (Flyway) com o usuário de DDL; termina e libera o backend. Mesma imagem do backend.
  migracao:
    image: caderneta-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: migracao
      CADERNETA_MIGRATION_PASSWORD: ${CADERNETA_MIGRATION_PASSWORD}
      # Dados fictícios de desenvolvimento: CADERNETA_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/dev
      SPRING_FLYWAY_LOCATIONS: ${CADERNETA_FLYWAY_LOCATIONS:-classpath:db/migration}
      # Primeiro gerente (só criado se não houver gerente ativo). Defina uma vez e depois remova do .env.
      CADERNETA_BOOTSTRAP_LOGIN: ${CADERNETA_BOOTSTRAP_LOGIN:-}
      CADERNETA_BOOTSTRAP_SENHA: ${CADERNETA_BOOTSTRAP_SENHA:-}
      CADERNETA_BOOTSTRAP_NOME: ${CADERNETA_BOOTSTRAP_NOME:-Gerente}
      CADERNETA_BOOTSTRAP_CPF: ${CADERNETA_BOOTSTRAP_CPF:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minha-rede
    restart: "no"

  # 3. Backend (Spring Boot): usuário só de DML, sem migrations.
  backend:
    build: ./backend-repo
    image: caderneta-backend:local
    ports:
      - "127.0.0.1:8082:8080" # só a própria máquina; o navegador usa /api pelo nginx (porta 3000)
    environment:
      # Perfil padrão VAZIO = seguro (cookie Secure). Para testar em HTTP local, use no .env
      # SPRING_PROFILES_ACTIVE=dev. Ver .env.example.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_FLYWAY_ENABLED: "false" # a migração é feita pelo serviço "migracao"
      CADERNETA_DB_PASSWORD: ${CADERNETA_DB_PASSWORD}
      # Nome do cookie de sessão. Produção atrás do Firebase Hosting: __session. Local: SESSION.
      CADERNETA_SESSAO_COOKIE: ${CADERNETA_SESSAO_COOKIE:-SESSION}
    depends_on:
      migracao:
        condition: service_completed_successfully
    networks:
      - minha-rede
    restart: on-failure

  # 4. Frontend (Flutter Web + nginx)
  frontend:
    build: ./frontend-repo
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - minha-rede

networks:
  minha-rede:
    driver: bridge

volumes:
  mysql84_data:
