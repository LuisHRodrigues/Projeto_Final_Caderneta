services:
  # 1. Serviço MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      MYSQL_DATABASE: api_caderneta_database
    ports:
      - "127.0.0.1:3307:3306" # só a própria máquina acessa o banco
    networks:
      - minha-rede
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Serviço de Backend (Spring Boot)
  backend:
    build: ./backend-repo # Caminho para a pasta do projeto Spring Boot com o Dockerfile
    ports:
      - "127.0.0.1:8082:8080" # só a própria máquina (porta 8082 no host, como definido pelo Eduardo); o navegador usa /api pelo nginx (porta 3000)
    environment:
      # Perfil padrão VAZIO = seguro (cookie Secure, sem fixtures). Para testar em HTTP local, crie um
      # arquivo .env (ignorado pelo git) com SPRING_PROFILES_ACTIVE=dev,dev-fixtures. Ver .env.example.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      # Primeiro gerente (só criado se não houver gerente ativo). Não há senha padrão.
      CADERNETA_BOOTSTRAP_LOGIN: ${CADERNETA_BOOTSTRAP_LOGIN:-}
      CADERNETA_BOOTSTRAP_SENHA: ${CADERNETA_BOOTSTRAP_SENHA:-}
      CADERNETA_BOOTSTRAP_NOME: ${CADERNETA_BOOTSTRAP_NOME:-Gerente}
      CADERNETA_BOOTSTRAP_CPF: ${CADERNETA_BOOTSTRAP_CPF:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minha-rede # Conecta à rede interna
    restart: on-failure

  # 3. Serviço de Frontend
  frontend:
    build: ./frontend-repo # Caminho para a pasta do seu projeto frontend com o Dockerfile
    ports:
      - "3000:80" # Mapeia porta do host (3000) para a porta interna do NGINX/Frontend (80)
    depends_on:
      - backend # Garante que o backend tente iniciar antes
    networks:
      - minha-rede

networks:
  minha-rede: # Define a rede virtual
    driver: bridge

volumes:
  mysql_data:
