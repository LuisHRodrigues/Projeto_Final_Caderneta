name: projeto_final_caderneta
services:
  mysql:
    image: ${MYSQL_IMAGE:?Defina a imagem MySQL validada}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: api_caderneta_database
      CADERNETA_DB_PASSWORD: ${CADERNETA_DB_PASSWORD:?}
      CADERNETA_MIGRATION_PASSWORD: ${CADERNETA_MIGRATION_PASSWORD:?}
    ports: ["127.0.0.1:3307:3306"]
    networks: [minha-rede]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-users.sh:/docker-entrypoint-initdb.d/01-users.sh:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    image: projeto_final_caderneta-backend:latest
    build:
      context: ./backend-repo
      dockerfile: Dockerfile.local
    ports: ["127.0.0.1:8082:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/api_caderneta_database?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      CADERNETA_DB_PASSWORD: ${CADERNETA_DB_PASSWORD:?}
      CADERNETA_MIGRATION_PASSWORD: ${CADERNETA_MIGRATION_PASSWORD:?}
      CADERNETA_BOOTSTRAP_LOGIN: ${CADERNETA_BOOTSTRAP_LOGIN:-}
      CADERNETA_BOOTSTRAP_SENHA: ${CADERNETA_BOOTSTRAP_SENHA:-}
      CADERNETA_BOOTSTRAP_CPF: ${CADERNETA_BOOTSTRAP_CPF:-}
    healthcheck:
      test: ["CMD-SHELL","wget -q -O- http://localhost:8080/api/saude || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    networks: [minha-rede]
    restart: unless-stopped
  frontend:
    image: projeto_final_caderneta-frontend:latest
    build:
      context: ./frontend-repo
      dockerfile: Dockerfile.local
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [minha-rede]
    restart: unless-stopped
networks:
  minha-rede:
    driver: bridge
volumes:
  mysql_data:
